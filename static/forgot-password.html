<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Recover your password via Telegram.">
<title>Password recovery · Family Budget</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><script src="/forgot-password.js" defer></script>
</head><body>
<header><div class="bar-in"><a class="brand" href="/login"><span class="logo">₸</span>Family Budget</a><span class="badge"><svg class="i" aria-hidden="true"><use href="#i-users"/></svg>Shared family budget</span></div></header>
<main class="login-layout"><section class="login-intro"><h1>Forgot password?</h1><p class="muted">Get a four-digit code in the Telegram account you linked earlier.</p><p class="muted">If Telegram was not linked, automatic recovery is unavailable. Contact the site owner.</p></section>
<section class="panel login-panel">
<form id="request-form"><label for="username">Username or phone number</label><input id="username" name="username" autocomplete="username" required maxlength="80" placeholder="Username or +7 777 123 45 67">
<button id="request-code" type="submit">Send code to Telegram</button></form>
<form id="reset-form" hidden><label for="code">Code from Telegram</label><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4}" minlength="4" maxlength="4" required>
<label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<label for="repeat">Repeat password</label><input id="repeat" name="password_repeat" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<button id="reset-password" type="submit">Save new password</button></form>
<p id="message" role="status" aria-live="polite"></p><p><a href="/login">Back to sign in</a></p></section></main></body></html>
